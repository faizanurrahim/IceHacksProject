
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7fb">

    <title>Login · CareerPath</title>
    <link rel="stylesheet" href="/assets/careerpath.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f6f7fb;
            color: #202437;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background: white;
            border-bottom: 1px solid #e9eaf0;
        }

        .brand {
            color: #635bff;
            font-size: 1.4rem;
            font-weight: 800;
            text-decoration: none;
        }

        .login-wrapper {
            min-height: calc(100vh - 65px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 35px 15px;
        }

        .login-card {
            background: white;
            width: 100%;
            max-width: 440px;
            padding: 38px;
            border-radius: 18px;
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.05);
        }

        .login-icon {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eeedff;
            color: #635bff;
            border-radius: 15px;
            font-size: 23px;
            margin-bottom: 22px;
        }

        .form-control {
            padding: 12px 14px;
            border-radius: 10px;
            border-color: #e0e2ea;
        }

        .form-control:focus {
            border-color: #635bff;
            box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.12);
        }

        .input-group .btn {
            border-color: #e0e2ea;
            color: #666;
        }

        .login-btn {
            background: #635bff;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #5148e5;
            color: white;
        }

        .login-btn:disabled {
            opacity: 0.7;
        }

        .signup-link {
            color: #635bff;
            font-weight: 600;
            text-decoration: none;
        }

        .signup-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="container">
        <a href="/get-started" class="brand">
            <i class="fa-solid fa-compass"></i>
            CareerPath
        </a>
    </div>
</nav>

<main class="login-wrapper">

    <div class="login-card">

        <div class="login-icon">
            <i class="fa-solid fa-user"></i>
        </div>

        <h2 class="fw-bold mb-2">Welcome back!</h2>

        <p class="text-muted mb-4">
            Log in to continue discovering your career path.
        </p>

        <div id="message" role="alert"></div>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold">
                    Email address
                </label>

                <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold">
                    Password
                </label>

                <div class="input-group">
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        class="btn"
                        type="button"
                        id="togglePassword"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="btn login-btn w-100"
                id="loginBtn"
            >
                Log In
                <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>

        </form>

        <div class="text-center mt-4">
            <span class="text-muted">
                Don't have an account?
            </span>

            <a href="/get-started" class="signup-link">
                Sign up
            </a>
        </div>

    </div>

</main>

<script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");
    const loginBtn = document.getElementById("loginBtn");
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");

    // Show / hide password
    togglePassword.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";

        passwordInput.type = hidden ? "text" : "password";

        togglePassword.innerHTML = hidden
            ? '<i class="fa-solid fa-eye-slash"></i>'
            : '<i class="fa-solid fa-eye"></i>';

        togglePassword.setAttribute(
            "aria-label",
            hidden ? "Hide password" : "Show password"
        );
    });

    function showMessage(text, type) {
        message.replaceChildren();

        const alert = document.createElement("div");
        alert.className = `alert alert-${type}`;
        alert.textContent = text;

        message.appendChild(alert);
    }

    // Login request
    form.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = passwordInput.value;

        loginBtn.disabled = true;
        loginBtn.innerHTML = `
            <i class="fa-solid fa-spinner fa-spin"></i>
            Logging in...
        `;

        message.replaceChildren();

        try {
            const response = await fetch("/api/v1/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const result = await response.json();

            if (!response.ok || !result.success) {
                throw new Error(
                    result.error ||
                    result.detail ||
                    result.message ||
                    "Login failed."
                );
            }

            showMessage("Login successful! Redirecting...", "success");

            window.location.href = "/dashboard";

        } catch (error) {
            showMessage(error.message, "danger");

            loginBtn.disabled = false;
            loginBtn.innerHTML = `
                Log In
                <i class="fa-solid fa-arrow-right ms-2"></i>
            `;
        }
    });
</script>

<script src="/assets/careerpath.js"></script>
</body>
</html>
